name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Verify dist output
        run: |
          test -f dist/nodes/WebRequestMarkdown/WebRequestMarkdown.node.js
          test -f dist/nodes/WebRequestMarkdown/WebRequestMarkdown.node.json
          test -f dist/nodes/WebRequestMarkdown/webrequestmarkdown.svg
          test -f dist/nodes/WebRequestMarkdown/webrequestmarkdown.dark.svg
          echo "All expected dist files present"
